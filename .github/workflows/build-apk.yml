# Ziarat APK build (GitHub Actions)
# Repo > Settings > Secrets and variables > Actions mein ye secrets add karein:
#   ZIARAT_PRIVY_APP_ID, ZIARAT_PRIVY_CLIENT_ID, ZIARAT_API_URL
# Phir Actions tab > "Build APK" > Run workflow. APK "Artifacts" mein milegi.
name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate android/ folder if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.ziarat --project-name ziarat .
          fi

      - name: Privy needs minSdk 28 + INTERNET permission in release
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] && sed -i -E 's/minSdk(Version)?( =|) *flutter\.minSdkVersion/minSdk = 28/' "$f" || true
          done
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"

      - name: Force compileSdk 36 for plugins (privy_flutter ships with 34)
        run: |
          F=android/build.gradle.kts
          if [ -f "$F" ] && ! grep -q 'ZIARAT_COMPILE_SDK_FIX' "$F"; then
            cat >> "$F" <<'KTS'

          // ZIARAT_COMPILE_SDK_FIX
          subprojects {
              val forceCompileSdk: Project.() -> Unit = {
                  extensions.findByName("android")?.let { ext ->
                      ext.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                  }
              }
              if (state.executed) forceCompileSdk() else afterEvaluate { forceCompileSdk() }
          }
          KTS
            sed -i 's/^          //' "$F"
          fi
          tail -15 "$F"

      - run: flutter pub get

      - name: Pre-install Android NDK (with retries)
        run: |
          NDK=$(grep -rhoE 'ndkVersion *= *"[^"]+"' android/app/build.gradle* | grep -oE '"[^"]+"' | tr -d '"' || true)
          [ -z "$NDK" ] || [ "$NDK" = "flutter.ndkVersion" ] && NDK=28.2.13676358
          echo "NDK=$NDK"
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          for i in 1 2 3 4; do
            yes | $SDKM --install "ndk;$NDK" > /dev/null && break
            echo "retry $i"; rm -rf "$ANDROID_HOME/ndk/$NDK"; sleep 10
          done
          ls "$ANDROID_HOME/ndk/$NDK/source.properties"

      - name: Build APK (release if Privy IDs set, otherwise demo/debug)
        env:
          APP_ID: ${{ secrets.ZIARAT_PRIVY_APP_ID }}
          CLIENT_ID: ${{ secrets.ZIARAT_PRIVY_CLIENT_ID }}
          API_URL: ${{ secrets.ZIARAT_API_URL }}
        run: |
          set -o pipefail
          report() {
            msg=$( { grep -n -E "error|Error|FAILURE|What went wrong|Exception" build.log | head -40; echo "----- tail -----"; tail -60 build.log; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=BuildLog::$msg"
          }
          trap 'report' ERR
          exec > >(tee build.log) 2>&1
          if [ -n "$APP_ID" ] && [ -n "$CLIENT_ID" ]; then
            flutter build apk --release \
              --dart-define=ZIARAT_PRIVY_APP_ID="$APP_ID" \
              --dart-define=ZIARAT_PRIVY_CLIENT_ID="$CLIENT_ID" \
              --dart-define=ZIARAT_API_URL="$API_URL"
            cp build/app/outputs/flutter-apk/app-release.apk ziarat.apk
          else
            echo "Privy IDs not set -> building DEMO (debug) APK without login"
            flutter build apk --debug --dart-define=ZIARAT_API_URL="$API_URL"
            cp build/app/outputs/flutter-apk/app-debug.apk ziarat.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ziarat-apk
          path: ziarat.apk

      - name: Publish APK as a GitHub Release (easy mobile download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ziarat APK build ${{ github.run_number }}
          files: ziarat.apk
          body: |
            Android APK. Demo/debug build if Privy IDs are not set in repo secrets.
