name: android-apk
# Manual or tag-triggered. Needs repo secrets: ZIARAT_API_URL, ZIARAT_PRIVY_APP_ID, ZIARAT_PRIVY_CLIENT_ID,
# ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:
  push: { tags: ["v*"] }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate Android scaffolding (the source archive ships without android/)
        run: |
          [ -d android ] || flutter create --platforms=android --org com.ziarat --project-name ziarat .
          # privy_flutter needs a modern minSdk; patch Groovy or Kotlin DSL
          sed -i -E 's/minSdk(Version)? ?=? ?flutter\.minSdkVersion/minSdk = 26/' android/app/build.gradle* || true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=ZIARAT_API_URL=${{ secrets.ZIARAT_API_URL }} \
            --dart-define=ZIARAT_PRIVY_APP_ID=${{ secrets.ZIARAT_PRIVY_APP_ID }} \
            --dart-define=ZIARAT_PRIVY_CLIENT_ID=${{ secrets.ZIARAT_PRIVY_CLIENT_ID }}
      - name: Sign with the release keystore
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > release.jks
          "$BT/zipalign" -f -p 4 build/app/outputs/flutter-apk/app-release.apk ziarat-aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" --key-pass "pass:${{ secrets.ANDROID_KEY_PASSWORD }}" \
            --out ziarat-release.apk ziarat-aligned.apk
          "$BT/apksigner" verify --print-certs ziarat-release.apk
          rm -f release.jks
      - uses: actions/upload-artifact@v4
        with: { name: ziarat-release-apk, path: ziarat-release.apk }
