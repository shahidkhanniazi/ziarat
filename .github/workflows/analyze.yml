name: Analyze
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - name: Privy API dump
        run: |
          P=$(find ~/.pub-cache/hosted -maxdepth 2 -type d -name 'privy_flutter-*' | head -1)
          F=$(grep -rlE "class (Success|Failure|Result)\b|sealed class Result|class AuthState|Authenticated" "$P/lib" | head -6)
          out=$(for f in $F; do echo "## $f"; grep -nE "class |fold|get |when|map\(|factory|const [A-Z]" "$f" | head -40; done | cut -c1-170 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::warning title=PrivyAPI::$out"
      - name: Analyze
        run: |
          out=$(flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error •" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}')
          echo "::warning title=Analyze::$out"
